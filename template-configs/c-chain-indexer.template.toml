[indexer]
mode = "fsp" # collects only what the FSP stack needs; the transaction and log filters are built into the indexer
history_epochs = 0 # reward epochs of fully indexed blocks to keep; 0 is the provider setting and keeps the current epoch
rpc_concurrency = 25 # max simultaneous RPC calls of any kind (blocks, receipts, eth_getLogs, contract calls) across the whole process; raise for a dedicated node, lower if it rate-limits
batch_size = 1000 # blocks fetched and committed per batch, in one DB transaction
log_range = 1000 # max blocks per eth_getLogs request; set to your node's getLogs cap
new_block_check_millis = 1000 # interval for checking for new blocks

# In fsp mode the required transaction and log filters are compiled into the
# indexer and resolved by name through the ContractRegistry, so no contract
# addresses are configured here. Extra [[indexer.collect_transactions]] and
# [[indexer.collect_logs]] entries are still merged with the built-ins if you
# need to index something additional.

[db]
log_queries = false
drop_table_at_start = false
# db.history_drop is ignored in fsp mode: retention follows history_epochs

[logger]
level = "INFO"
console = true
