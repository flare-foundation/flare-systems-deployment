[client]
submission_address = "${SUBMISSION}"
flare_system_manager = "${FLARE_SYSTEMS_MANAGER}"
incentive_manager_address = "${FAST_UPDATE_INCENTIVE_MANAGER}"
fast_updates_configuration_address = "${FAST_UPDATES_CONFIGURATION}"
submission_window = 10
advance_blocks = 0
max_weight = 512
value_provider_url = "${FAST_UPDATES_VALUE_PROVIDER_URL}"

[transactions]
gas_limit = 3000000
value = 0
# Submissions are EIP-1559 (type 2) transactions since fast-updates v1.1.0;
# gas_price_multiplier is no longer used. Values match the client defaults.
base_fee_multiplier = 4
max_priority_fee_multiplier = 2
minimal_max_priority_fee = 100_000_000_000  # 100 Gwei
maximal_max_priority_fee = 5000_000_000_000 # 5000 Gwei

[logger]
level = "${LOG_LEVEL}"
console = true

[chain]
chain_id = ${CHAIN_ID}
