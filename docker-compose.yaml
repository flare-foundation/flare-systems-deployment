x-stop-grace-period: &stop-grace-period-policy
    # NOTE: Voting round 90s + reveal deadline 45s + signatures grace 10s
    stop_grace_period: 145s 

x-restart: &restart-policy
    restart: unless-stopped

volumes:
  indexer_data_v2:

services:
  c-chain-indexer-db:
    <<: *restart-policy
    image: "mysql:9.5.0@sha256:57c892ddeb17e6c7dddf219914db017b2cf3e2797806a75424444b83622cc8ef"
    profiles: [fsp, ftso, fdc, tee]
    environment:
      MYSQL_ROOT_PASSWORD: "root"
    volumes:
      - ./config/init.sql:/docker-entrypoint-initdb.d/db_init.sql
      - indexer_data_v2:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent", "--host", "localhost", "-proot"]
      timeout: 20s
      retries: 10

  c-chain-indexer:
    <<: *restart-policy
    image: ghcr.io/flare-foundation/flare-system-c-chain-indexer:v2.1.0@sha256:c5f2e15b03c74bfe4d6c6c5c89a082655f6ae8b8e4fa7381029c2d48ad8bcdee
    profiles: [fsp, ftso, fdc, tee]
    environment:
      # db
      DB_HOST: "c-chain-indexer-db"
      DB_PORT: 3306
      DB_DATABASE: "fsp_indexer"
      DB_USERNAME: "root"
      DB_PASSWORD: "root"
      # node
      NODE_API_KEY: ${NODE_API_KEY}
      NODE_URL: ${NODE_RPC_URL}
    volumes:
      - ./mounts/c-chain-indexer/config.toml:/app/config.toml
    depends_on:
      c-chain-indexer-db:
        condition: service_healthy
    # /health is 503 until the startup backfill completes, 200 after; the services
    # reading the database wait for it. start_period must cover that backfill, so
    # raise it along with indexer.history_epochs.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30m
      start_interval: 2s

  system-client:
    <<: [*restart-policy, *stop-grace-period-policy]
    image: ghcr.io/flare-foundation/flare-system-client:v1.2.1@sha256:e32425a22e39ea88a15610db418cebb79871cf9ffbb740d2a3a22a3a66311295
    profiles: [fsp, system-client]
    environment:
      # db
      DB_HOST: "c-chain-indexer-db"
      DB_PORT: 3306
      DB_DATABASE: "fsp_indexer"
      DB_USERNAME: "root"
      DB_PASSWORD: "root"
      # node
      ETH_RPC_URL: ${NODE_RPC_URL}
      API_KEY: ${NODE_API_KEY}
      # private keys
      SYSTEM_CLIENT_SENDER_PRIVATE_KEY: ${SIGNING_PK}
      SIGNING_POLICY_PRIVATE_KEY: ${SIGNING_PK}
      PROTOCOL_MANAGER_SUBMIT_PRIVATE_KEY: ${SUBMIT_PK}
      PROTOCOL_MANAGER_SUBMIT_SIGNATURES_PRIVATE_KEY: ${SIGNATURES_PK}
      # underlying client api keys
      PROTOCOL_X_API_KEY_100: ${PROTOCOL_X_API_KEY_100}
      PROTOCOL_X_API_KEY_200: ${PROTOCOL_X_API_KEY_200}
    volumes:
      - ./mounts/system-client/config.toml:/app/config.toml
    depends_on:
      c-chain-indexer:
        condition: service_healthy

  ftso-client:
    <<: [*restart-policy, *stop-grace-period-policy]
    image: ghcr.io/flare-foundation/ftso-scaling:v1.2.1@sha256:2972ac7050a54206b3bdf743fa37732b110dfb488fb76fc4aece26fea3c46b89
    profiles: [fsp, ftso]
    environment:
      DB_HOST: "c-chain-indexer-db"
      DB_PORT: 3306
      DB_NAME: "fsp_indexer"
      DB_USERNAME: "root"
      DB_PASSWORD: "root"
    env_file:
      - ./mounts/ftso-client/.env
    depends_on:
      c-chain-indexer:
        condition: service_healthy

  fdc-client:
    <<: [*restart-policy, *stop-grace-period-policy]
    image: ghcr.io/flare-foundation/fdc-client:v1.4.3@sha256:2798fea7b307045ae444bbc7bd07af6179be53c6b92c00442813538bd2981334
    profiles: [fsp, fdc]
    environment:
      DB_HOST: "c-chain-indexer-db"
      DB_PORT: 3306
      DB_DATABASE: "fsp_indexer"
      DB_USERNAME: "root"
      DB_PASSWORD: "root"
    volumes:
      - ./mounts/fdc-client/config.toml:/app/configs/userConfig.toml
    depends_on:
      c-chain-indexer:
        condition: service_healthy

  tee-relay-client:
    <<: *restart-policy
    image: ghcr.io/flare-foundation/tee-relay-client:v0.0.5@sha256:c1983209df26b3ad9c8584dbea64d78e777470ba8a47dab2253b24feb3edf3a1
    profiles: [tee]
    environment:
      PRIVATE_KEY: ${SIGNING_PK}
    volumes:
      - ./mounts/tee-relay-client/config.toml:/app/config.toml
    depends_on:
      c-chain-indexer:
        condition: service_healthy

  fast-updates:
    <<: *restart-policy
    image: ghcr.io/flare-foundation/fast-updates/go-client:v1.2.0@sha256:d956111c796e176cd69c991c85baf85a43a54c21a1d468d68fac18f9e128ccdf
    profiles: [fast-updates]
    environment:
      SIGNING_PRIVATE_KEY: ${SIGNING_PK}
      ACCOUNTS: ${FAST_UPDATES_ACCOUNTS}
      SORTITION_PRIVATE_KEY: ${FAST_UPDATES_SORTITION_PRIVATE_KEY}
      NODE_URL: ${NODE_RPC_URL}
      API_KEY: ${NODE_API_KEY}
    volumes:
      - ./mounts/fast-updates/config.toml:/app/config.toml
