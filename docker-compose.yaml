x-stop-grace-period: &stop-grace-period-policy
    # NOTE: Voting round 90s + reveal deadline 45s + signatures grace 10s
    stop_grace_period: 145s 

x-restart: &restart-policy
    restart: unless-stopped

volumes:
  indexer_data_v2:

services:
  c-chain-indexer-db:
    <<: *restart-policy
    image: "mysql:9.5.0@sha256:57c892ddeb17e6c7dddf219914db017b2cf3e2797806a75424444b83622cc8ef"
    profiles: [fsp, ftso, fdc, tee]
    environment:
      MYSQL_ROOT_PASSWORD: "root"
    volumes:
      - ./config/init.sql:/docker-entrypoint-initdb.d/db_init.sql
      - indexer_data_v2:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--silent", "--host", "localhost", "-proot"]
      timeout: 20s
      retries: 10

  c-chain-indexer:
    <<: *restart-policy
    image: ghcr.io/flare-foundation/flare-system-c-chain-indexer:v2.0.2@sha256:4f5bb1e00b3e0b5f1dfb45670247505bdc7a0fee27df72f3e6bc57d5ac58a29f
    profiles: [fsp, ftso, fdc, tee]
    environment:
      # db
      DB_HOST: "c-chain-indexer-db"
      DB_PORT: 3306
      DB_DATABASE: "fsp_indexer"
      DB_USERNAME: "root"
      DB_PASSWORD: "root"
      # node
      NODE_API_KEY: ${NODE_API_KEY}
      NODE_URL: ${NODE_RPC_URL}
    volumes:
      - ./mounts/c-chain-indexer/config.toml:/app/config.toml
    depends_on:
      c-chain-indexer-db:
        condition: service_healthy
    # /health is 503 until the startup backfill completes, 200 after; the services
    # reading the database wait for it. start_period must cover that backfill, so
    # raise it along with indexer.history_epochs.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30m
      start_interval: 2s

  system-client:
    <<: [*restart-policy, *stop-grace-period-policy]
    image: ghcr.io/flare-foundation/flare-system-client:v1.2.0@sha256:b007bfc77defef490ad4617fb4eced960dd4d5724c54158b95a807febb4d5c1c
    profiles: [fsp, system-client]
    environment:
      # db
      DB_HOST: "c-chain-indexer-db"
      DB_PORT: 3306
      DB_DATABASE: "fsp_indexer"
      DB_USERNAME: "root"
      DB_PASSWORD: "root"
      # node
      ETH_RPC_URL: ${NODE_RPC_URL}
      API_KEY: ${NODE_API_KEY}
      # private keys
      SYSTEM_CLIENT_SENDER_PRIVATE_KEY: ${SIGNING_PK}
      SIGNING_POLICY_PRIVATE_KEY: ${SIGNING_PK}
      PROTOCOL_MANAGER_SUBMIT_PRIVATE_KEY: ${SUBMIT_PK}
      PROTOCOL_MANAGER_SUBMIT_SIGNATURES_PRIVATE_KEY: ${SIGNATURES_PK}
      # underlying client api keys
      PROTOCOL_X_API_KEY_100: ${PROTOCOL_X_API_KEY_100}
      PROTOCOL_X_API_KEY_200: ${PROTOCOL_X_API_KEY_200}
    volumes:
      - ./mounts/system-client/config.toml:/app/config.toml
    depends_on:
      c-chain-indexer:
        condition: service_healthy

  ftso-client:
    <<: [*restart-policy, *stop-grace-period-policy]
    image: ghcr.io/flare-foundation/ftso-scaling:v1.2.0@sha256:b9cd05a726dcec40e1e36dd808546b6d39f7743c8f7b69822e476e09c834c081
    profiles: [fsp, ftso]
    environment:
      DB_HOST: "c-chain-indexer-db"
      DB_PORT: 3306
      DB_NAME: "fsp_indexer"
      DB_USERNAME: "root"
      DB_PASSWORD: "root"
    env_file:
      - ./mounts/ftso-client/.env
    depends_on:
      c-chain-indexer:
        condition: service_healthy

  fdc-client:
    <<: [*restart-policy, *stop-grace-period-policy]
    image: ghcr.io/flare-foundation/fdc-client:v1.4.2@sha256:b508555b1ccf6babe9d0def84e469829df97a2b353ffada3b0cc0292f67cb7d9
    profiles: [fsp, fdc]
    environment:
      DB_HOST: "c-chain-indexer-db"
      DB_PORT: 3306
      DB_DATABASE: "fsp_indexer"
      DB_USERNAME: "root"
      DB_PASSWORD: "root"
    volumes:
      - ./mounts/fdc-client/config.toml:/app/configs/userConfig.toml
    depends_on:
      c-chain-indexer:
        condition: service_healthy

  tee-relay-client:
    <<: *restart-policy
    image: ghcr.io/flare-foundation/tee-relay-client:v.0.0.3@sha256:33b043202b4cc8679ce675987daf9bd83c719cc6feb6545b85ddf303b7cdd7aa
    profiles: [tee]
    environment:
      PRIVATE_KEY: ${SIGNING_PK}
    volumes:
      - ./mounts/tee-relay-client/config.toml:/app/config.toml
    depends_on:
      c-chain-indexer:
        condition: service_healthy

  fast-updates:
    <<: *restart-policy
    image: ghcr.io/flare-foundation/fast-updates/go-client:v1.1.0@sha256:1782ada7361afd5dac68ea21bfffca11afd38e1f121d9bb64c5d7415993841ec
    profiles: [fast-updates]
    environment:
      SIGNING_PRIVATE_KEY: ${SIGNING_PK}
      ACCOUNTS: ${FAST_UPDATES_ACCOUNTS}
      SORTITION_PRIVATE_KEY: ${FAST_UPDATES_SORTITION_PRIVATE_KEY}
      NODE_URL: ${NODE_RPC_URL}
      API_KEY: ${NODE_API_KEY}
    volumes:
      - ./mounts/fast-updates/config.toml:/app/config.toml
